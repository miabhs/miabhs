<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core">

    <style>
        .Hijau {
            background-color: var(--green-500)!important;
        }
        .Kuning {
            background-color: var(--yellow-500)!important;
        }
        .Oranye {
            background-color: var(--orange-500)!important;
        }
        .Merah {
            background-color: var(--red-500)!important;
        }
    </style>

    <ui:decorate template="/WEB-INF/components/core/base/table.xhtml" >
        <ui:define name="columns"> 

            <p:column width="5%">
                <f:facet name="header">
                    <div class="flex justify-content-center">
                        <h:outputText value="Validasi" class="block" />                     
                    </div>
                </f:facet>
                <h:panelGroup id="confirmation" layout="block" class="flex justify-content-center w-12">
                    <p:fragment update="true">
                        <p:commandButton action="#{viewPage.confirm(data)}" 
                                         rendered="#{viewPage.isUserHasRoles(dataView.confirmPermission) and data.confirmed}"
                                         icon="pi pi-bookmark-fill" 
                                         class="ui-button-info rounded-button ui-button-flat"  />
                        <p:commandButton rendered="#{(not viewPage.isUserHasRoles(dataView.confirmPermission)) and data.confirmed}"
                                         icon="pi pi-bookmark-fill" 
                                         class="ui-button-info rounded-button ui-button-flat"  />
                        <p:commandButton action="#{viewPage.confirm(data)}" 
                                         rendered="#{viewPage.isUserHasRoles(dataView.confirmPermission) and (not data.confirmed)}"
                                         icon="pi pi-bookmark"
                                         class="rounded-button ui-button-flat"  />
                        <p:commandButton rendered="#{(not viewPage.isUserHasRoles(dataView.confirmPermission)) and (not data.confirmed)}"
                                         icon="pi pi-bookmark"
                                         class="rounded-button ui-button-flat"  />
                    </p:fragment>
                </h:panelGroup>
            </p:column>

            <p:column exportValue="activityDate" >
                <f:facet name="header">
                    <div class="flex justify-content-center">
                        <h:outputText value="Tanggal" class="block" />                     
                    </div>
                </f:facet>
                <p:cellEditor>
                    <f:facet name="output">
                        <h:panelGroup layout="block" class="flex justify-content-center w-12">
                            <h:outputText value="#{data.activityDate}" class="white-space-normal text-base font-medium">
                                <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </h:panelGroup>
                    </f:facet>
                    <f:facet name="input">
                        <h:panelGroup layout="block" class="flex justify-content-center w-12">
                            <p:datePicker value="#{data.activityDate}" showIcon="false"
                                          pattern="dd/MM/yyyy" immediate="true" inputStyleClass="text-center"                                     
                                          yearNavigator="true" monthNavigator="true" 
                                          showOnFocus="true" flex="true" size="10"
                                          locale="#{IslamicDateConverter.locale}">
                                <p:ajax event="dateSelect" oncomplete="PF('#{dataView.name}').saveCell(PF('#{dataView.name}').currentCell)" />
                            </p:datePicker>
                        </h:panelGroup>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column  exportValue="santri">                            
                <f:facet name="header">
                    <div class="flex justify-content-center">
                        <h:outputText value="Santri" class="block" />
                    </div>
                </f:facet>
                <p:cellEditor id="santri">
                    <f:facet name="output">
                        <h:outputText value="#{data.santriName}" class="white-space-normal text-base font-medium block mb-2" />
                        <h:outputText value="#{data.kelompokPengasuhanName}"
                                      class="white-space-normal font-light text-sm font-italic" />
                    </f:facet>
                    <f:facet name="input">
                        <span class="ui-input-icon-right">
                            <i class="pi pi-chevron-down" />
                            <p:inputText value="#{data.santriName}" 
                                         style="cursor: pointer;"
                                         readonly="true"
                                         onclick="showSantriSelector('#{component.clientId}', '#{component.parent.parent.clientId}, #{component.parent.parent.clientId.replace('santri', 'confirmation')}')" />
                        </span>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column>
                <f:facet name="header">
                    <div class="flex justify-content-center">
                        <h:outputText value="Catatan" class="block" />
                    </div>
                </f:facet>
                <p:cellEditor id="bentuk-aktifitas">
                    <f:facet name="output">
                        <h:panelGroup class="flex align-items-start w-12 gap-2">
                            <h:outputText value="#{data.bentukAktifitasNilai.label}"  
                                          class="flex-grow-0 flex-shrink-0 justify-content-center flex align-items-center w-2rem h-2rem #{data.bentukAktifitasNilai.color} font-bold text-sm text-white" />
                            <h:panelGroup layout="block" class="flex-grow-1 flex flex-column">
                                <h:outputText class="white-space-normal font-medium text-base block mb-2" value="#{data.bentukAktifitasBentuk}" />                            
                                <h:outputText value="#{data.bentukAktifitasJenis.label}" 
                                              class="align-self-end white-space-normal font-light text-sm font-italic" />
                            </h:panelGroup>
                        </h:panelGroup>
                    </f:facet>
                    <f:facet name="input">
                        <span class="ui-input-icon-right w-12">
                            <i class="pi pi-chevron-down" />
                            <p:inputTextarea value="#{data.bentukAktifitasBentuk}"  class="w-full"
                                             style="cursor: pointer;"
                                             readonly="true"
                                             onclick="showBentukAktifitasSelector('#{component.clientId}', '#{component.parent.parent.clientId}, #{component.parent.parent.clientId.replace('bentuk-aktifitas', 'confirmation')}')" />
                        </span>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column exportValue="notes"  >
                <f:facet name="header">
                    <div class="flex justify-content-center">
                        <h:outputText value="Keterangan" class="block" />                     
                    </div>
                </f:facet>
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText id="notes" class="white-space-normal font-medium" value="#{data.notes}"  />
                    </f:facet>
                    <f:facet name="input">
                        <p:inputTextarea widgetVar="notes" value="#{data.notes}"
                                         immediate="true"
                                         onkeypress="if (event.keyCode === 13) {
                                                     PF('#{dataView.name}').saveCell(PF('#{dataView.name}').currentCell);
                                                     return false;
                                                 }"
                                         class="w-full h-full" />
                    </f:facet>
                </p:cellEditor>
            </p:column>

        </ui:define>
    </ui:decorate>

    <ui:decorate template="/WEB-INF/components/core/base/lazychooser.xhtml" >
        <ui:param name="name" value="SantriSelector" />
        <ui:param name="widgetVar" value="santriSelector" />
        <ui:param name="id" value="santri-selector" />
        <ui:param name="chooser" value="#{dataView.santriChooser}" />
        <ui:define name="columns">
            <p:column>
                <h:outputText value="#{data ne null ? data.name : ' '}" />
            </p:column>

            <p:column>
                <h:outputText value="#{((data ne null) and (data.kelompokPengasuhan ne null)) ? data.kelompokPengasuhan.organization.name : ' '}" />
            </p:column>
        </ui:define>
    </ui:decorate>

    <ui:decorate template="/WEB-INF/components/core/base/lazychooser.xhtml" >
        <ui:param name="name" value="BentukAktifitasSelector" />
        <ui:param name="widgetVar" value="bentukAktifitasSelector" />
        <ui:param name="id" value="bentukaktifitas-selector" />
        <ui:param name="chooser" value="#{dataView.bentukAktifitasChooser}" />
        <ui:define name="columns">
            <p:column>
                <h:outputText value="#{data ne null ? data.bentuk : ''}" />
            </p:column>
            <p:column width="30%">
                <h:outputText value="#{data ne null ? data.jenis.label : ''}" />
            </p:column>
        </ui:define>
    </ui:decorate>

</ui:composition>
