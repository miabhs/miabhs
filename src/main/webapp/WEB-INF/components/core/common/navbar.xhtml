<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core">


    <div class="block flex-grow-0 flex flex-nowrap gap-2 align-items-center surface-300 border-0 border-bottom-1 border-300 px-2 py-1">
        <h:form class="flex flex-nowrap align-items-center flex-grow-1 gap-2 mr-2">
            <ui:insert name="parent-nav">
                <p:menuButton  icon="pi pi-bars" menuStyleClass="w-max" >                
                    <ui:insert name="module-menu"/>
                    <p:separator/>
                    <p:menuitem value="Beranda" action="#{systemNavigator.open('Home', '')}" immediate="true" ajax="false"
                                icon="pi pi-home" class="ui-button-flat" />
                </p:menuButton>
            </ui:insert>
            <ui:insert name="page-title">
                <h:outputText value="#{title}" 
                              class="ui-widget text-color font-medium text-2xl ml-2" />
            </ui:insert>
        </h:form>
        <h:form id="crud-tools-frm" class="flex justify-content-end align-items-center flex-grow-0 gap-2">
            <ui:insert name="crud-tools" >
                <ui:insert name="crud-create">
                    <ui:include src="/WEB-INF/components/core/base/crud-create.xhtml" />
                </ui:insert>
                <ui:insert name="crud-update">
                    <ui:include src="/WEB-INF/components/core/base/crud-update.xhtml" />
                </ui:insert>
                <ui:insert name="crud-delete">
                    <ui:include src="/WEB-INF/components/core/base/crud-delete.xhtml" />
                </ui:insert>
            </ui:insert> 
        </h:form>
        <h:form  id="top-tools-frm">
            <ui:insert name="top-tools" />
        </h:form>
        <ui:insert name="sorter" />
        <ui:insert name="overlayFilter" />
        <h:form>
            <p:menuButton icon="pi pi-user"  buttonStyleClass="ui-button-secondary" 
                          menuStyleClass="w-max" >
                <p:menuitem value="#{request.userPrincipal.toString()}" styleClass="font-bold" />
                <p:separator />
                <ui:insert name="user-menu" />
                <p:menuitem value="Ubah Password"
                            action="#{securityNavigator.open('PasswordEditor', viewPage)}" 
                            rendered="#{viewPage.isUserHasRoles('can_login')}"
                            icon="pi pi-key" />
                <p:menuitem value="User"
                            rendered="#{viewPage.isUserHasRoles('manage_security','manage_universe')}"
                            action="#{securityNavigator.open('User', viewPage)}"
                            icon="pi pi-shield" />
                <p:menuitem value="Pengaturan"
                            action="#{viewPage.gotoConfigs}"
                            rendered="#{viewPage.isUserHasRoles('manage_configs','manage_universe')}"
                            icon="pi pi-cog" />
                <p:separator />
                <ui:insert name="logout-menu">
                    <p:menuitem value="Keluar" action="#{loginPage.logout}" 
                                ajax="false" icon="pi pi-sign-out"
                                rendered="#{viewPage.isUserHasRoles('can_login')}" />
                </ui:insert>
            </p:menuButton>
        </h:form>
    </div>

</ui:composition>
