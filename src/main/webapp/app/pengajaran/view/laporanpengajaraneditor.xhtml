<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/explorer.xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:pe="http://primefaces.org/ui/extensions" 
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <f:metadata>
        <ui:param name="title" value="Editor Laporan Hasil Pembelajaran" /> 
        
        <ui:param name="viewPage" value="#{laporanPengajaranEditorPage}" /> 
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>    

        <ui:param name="masterTitle" value="Periode" />
        <ui:param name="masterDataView" value="#{viewPage.periodePembelajaranTree}" />
        <ui:param name="masterContentId" value=":master-frm:#{masterDataView.name}" /> 
        <ui:param name="master_notool" value="true" />

        <ui:param name="masterFilter" value="#{masterDataView.filter}" />
        <ui:param name="masterFilterType" value="overlay" />
        <ui:param name="masterFilterUi" value="/WEB-INF/components/app/santri/periodepembelajaran-filterui.xhtml" />
        <ui:include src="/WEB-INF/components/app/santri/meta/periodepembelajaran-filterui.xhtml" >
            <ui:param name="filter" value="#{masterFilter}" />
        </ui:include>

        <f:viewParam name="ps" value="#{masterDataView.selectionInternal}" converter="PeriodePembelajaranConverter" transient="true" />

        <ui:param name="detailTitle" value="Hasil Pembelajaran" />
        <ui:param name="detailDataView" value="#{viewPage.santriList}" />
        <ui:param name="detailContentId" value=":detail-frm:#{detailDataView.name}" /> 
        <ui:param name="detail_notool" value="true" />

        <ui:param name="detailFilter" value="#{viewPage.filter}" />
        <ui:param name="detailFilterType" value="overlay" />
        <ui:param name="detailFilterUi" value="/WEB-INF/components/app/pengajaran/pengajaransantri-filterui.xhtml" />
        <ui:include src="/WEB-INF/components/app/pengajaran/meta/pengajaransantri-filterui.xhtml" >
            <ui:param name="filter" value="#{detailFilter}" />
        </ui:include>

        <ui:param name="detailPager" value="#{detailDataView.pager}" />
        <f:viewParam name="dPSz" value="#{detailPager.pageSize}" converter="LongConverter" transient="true" />
        <f:viewParam name="dOff" value="#{detailPager.offset}" converter="LongConverter" transient="true" />

    </f:metadata>

    <ui:define name="styles">
        <style>
            .ui-datatable-scrollable-header, .ui-treetable-scrollable-header {
                display: none;
            }
            .ui-datatable-scrollable-body {
                display: flex!important;
                flex-direction: column!important;
            }
            .ui-datatable-scrollable-header-box table, .ui-datatable-scrollable-body table {
                width: auto!important
            }
            .ui-treetable-scrollable-body {
                padding-right: 0!important;
            }
            tr.ui-treetable-selectable-node td {
                padding: .55rem 1rem!important;
            }
        </style>
    </ui:define> 

    <ui:define name="module-menu">
        <ui:include src="/WEB-INF/components/app/pengajaran/module-menu.xhtml" />
    </ui:define>
    
    <ui:define name="master-crud-tools" />

    <ui:define name="master-pager" />

    <ui:define name="master">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
            
            .amiri-regular {
                font-family: "Amiri", serif;
                font-weight: 400;
                font-style: normal;
            }

            .amiri-bold {
                font-family: "Amiri", serif;
                font-weight: 700;
                font-style: normal;
            }

            .amiri-regular-italic {
                font-family: "Amiri", serif;
                font-weight: 400;
                font-style: italic;
            }

            .amiri-bold-italic {
                font-family: "Amiri", serif;
                font-weight: 700;
                font-style: italic;
            }


            .ui-datatable-scrollable-header, .ui-treetable-scrollable-header {
                display: none;
            }
            .ui-datatable-scrollable-body {
                display: flex!important;
                flex-direction: column!important;
            }
            .ui-datatable-scrollable-header-box table, .ui-datatable-scrollable-body table {
                width: auto!important
            }
            .ui-treetable-scrollable-body {
                padding-right: 0!important;
            }
            tr.ui-treetable-selectable-node td {
                padding: .55rem 1rem!important;
            }
        </style>
        <h:form id="master-frm">
            <ui:decorate template="/WEB-INF/components/app/santri/periodepembelajarantree.xhtml" >
                <ui:param name="dataView" value="#{masterDataView}" />
                <ui:param name="selectCallback" value="refreshDetail()" />
            </ui:decorate>
        </h:form>
    </ui:define>

    <ui:define name="master-pager"/>
    
    <ui:define name="detail-crud-tools" />

    <ui:define name="detail-tools" />

    <ui:define name="detail">
        <h:form id="detail-frm" class="flex-grow-1 flex align-items-stretch">
            <ui:decorate template="/WEB-INF/components/core/base/table.xhtml" >
                <ui:param name="dataView" value="#{detailDataView}" />
                <ui:param name="styleClass" value="w-full border-0" />

                <ui:define name="columns">
                    <p:column >
                        <div class="grid grid-nogutter border-round border-2 border-300 surface-200 p-4 gap-2 ">

                            <div class="col-12 grid grid-nogutter border-0" >
                                <div class="col-6 grid grid-nogutter flex-column gap-4 p-2" >
                                    <div class="col-12 grid">
                                        <p:outputLabel value="NIS" class="col-3" />
                                        <p:inputText value="#{data.nis}" readonly="true" class="col-9" />
                                    </div>
                                    <div class="col-12 grid grid">
                                        <p:outputLabel value="Nama" class="col-3" />
                                        <p:inputText value="#{data.person.name}" readonly="true" class="col-9" />
                                    </div>
                                    <div class="col-12 grid grid">
                                        <p:outputLabel value="Kelompok" class="col-3" />
                                        <p:inputText value="#{data.kelompokPengasuhan.organization.name}" readonly="true" class="col-9" />
                                    </div>
                                </div>

                                <div class="col-6 grid grid-nogutter flex-column gap-4 p-2" >
                                    <div class="col-12 grid">
                                        <p:outputLabel value="Tahun Pembelajaran" class="col-5" />
                                        <p:inputText value="#{masterFilter.content.tahunPembelajaran.name}" readonly="true" class="col-7" />
                                    </div>
                                    <div class="col-12 grid">
                                        <p:outputLabel value="Periode" class="col-5" />
                                        <p:inputText value="#{masterDataView.selection.name}" readonly="true" class="col-7" />
                                    </div>
                                    <div class="col-12 grid grid">
                                        <p:outputLabel value="Tahun Ke" class="col-5" />
                                        <p:inputText value="#{data.calculateTahunBelajar(masterFilter.content.tahunPembelajaran)}" readonly="true" class="col-7" />
                                    </div>
                                </div>
                            </div>
                            
                            <p:dataTable value="#{viewPage.getPencapaianPembelajaran(data)}" 
                                         var="pencapaian" size="small"  tableStyle="width: 100%!important"  >
                                <p:column headerText="Jenis Pengajaran" groupRow="true">
                                    <h:outputText value="#{pencapaian.jenisPengajaranNama}" />
                                </p:column>
                                <p:column headerText="Jenis Kitab">
                                    <div class="text-right w-full">
                                        <h:outputText value="#{pencapaian.jenisKitabJudul}" styleClass="amiri-regular text-lg"/>
                                    </div>
                                </p:column>
                                <p:column headerText="Pencapaian">
                                    <h:outputText value="#{pencapaian.pencapaian}"  />
                                </p:column>
                            </p:dataTable>
                            
                            <p:panel header="Catatan"  id="catatan"  styleClass="col-12 border-1 border-300" >
                                <f:facet name="actions">
                                    <h:panelGroup layout="block" styleClass="flex gap-4">
                                        <p:commandLink action="#{viewPage.editorCatatan.load(data)}"
                                                       immediate="true" rendered="#{not viewPage.editorCatatan.isEditing(data)}"
                                                       update="@parent:@parent:catatan :messages"
                                                       class="ui-button-flat flex-grow-0" >
                                            <h:outputText styleClass="ui-icon pi pi-pencil" />
                                        </p:commandLink>
                                        <p:commandLink actionListener="#{viewPage.editorCatatan.save}"
                                                       rendered="#{viewPage.editorCatatan.isEditing(data)}"
                                                       update="@parent:@parent:catatan :messages"
                                                       class="ui-button-flat flex-grow-0" >
                                            <h:outputText styleClass="ui-icon pi pi-check" />
                                        </p:commandLink>
                                        <p:commandLink action="#{viewPage.editorCatatan.cancel()}"
                                                       immediate="true" rendered="#{viewPage.editorCatatan.isEditing(data)}"
                                                       update="@parent:@parent:catatan :messages"
                                                       class="ui-button-flat flex-grow-0" >
                                            <h:outputText styleClass="ui-icon pi pi-undo" />
                                        </p:commandLink>
                                    </h:panelGroup>
                                </f:facet>
                                <p:textEditor value="#{viewPage.getCatatan(data) ne null ? viewPage.getCatatan(data).catatan : null}"
                                              readonly="true" toolbarVisible="false" 
                                              rendered="#{not viewPage.editorCatatan.isEditing(data)}" class="border-0" />
                                <p:textEditor id="editor" value="#{viewPage.editorCatatan.buffer}"                                    
                                              rendered="#{viewPage.editorCatatan.isEditing(data)}" 
                                              height="100px">
                                    <f:facet name="toolbar">
                                        <span class="ql-formats flex-grow-1">
                                            <button class="ql-bold"/>
                                            <button class="ql-italic"/>
                                            <button class="ql-underline"/>
                                            <select class="ql-color" />
                                        </span>
                                    </f:facet>
                                </p:textEditor>
                            </p:panel>   
                            
                        </div>
                    </p:column>
                </ui:define>

            </ui:decorate>
        </h:form>
    </ui:define>

</ui:composition>
