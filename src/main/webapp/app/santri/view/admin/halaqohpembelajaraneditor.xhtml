<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/editor-page.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

    <f:metadata>
        <ui:param name="viewPage" value="#{halaqohPembelajaranEditorPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/> 

        <ui:param name="primaryTitle" value="Editor Halaqoh Pembelajaran" />
        <ui:param name="secondaryTitle" value="Baru" />  

        <ui:param name="notool" value="true" />

        <f:viewParam name="entity" value="#{viewPage.entity}" converter="HalaqohPengajaranConverter" transient="true" />

        <f:viewAction action="#{viewPage.load}" />
    </f:metadata>

    <ui:define name="content-header" />

    <ui:define name="styles">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');

            .amiri-regular {
                font-family: "Amiri", serif;
                font-weight: 400;
                font-style: normal;
            }

            .amiri-bold {
                font-family: "Amiri", serif;
                font-weight: 700;
                font-style: normal;
            }

            .amiri-regular-italic {
                font-family: "Amiri", serif;
                font-weight: 400;
                font-style: italic;
            }

            .amiri-bold-italic {
                font-family: "Amiri", serif;
                font-weight: 700;
                font-style: italic;
            }


            .ui-datatable-scrollable-header, .ui-treetable-scrollable-header {
                display: none;
            }
            .ui-datatable-scrollable-body {
                display: flex!important;
                flex-direction: column!important;
            }
            .ui-datatable-scrollable-header-box table, .ui-datatable-scrollable-body table {
                width: auto!important
            }
            .ui-treetable-scrollable-body {
                padding-right: 0!important;
            }
            tr.ui-treetable-selectable-node td {
                padding: .55rem 1rem!important;
            }
        </style>
        
    </ui:define>        
        
    <ui:define name="form">

        <div class="grid w-full p-3">

            <ui:decorate template="/WEB-INF/components/core/party/organizationeditorform.xhtml" >
                <ui:param name="editor" value="#{viewPage}" />
                <ui:define name="organization-form" />
                <ui:define name="postaladdress-form" />
                <ui:define name="telecommunicationnumber-form" />
                <ui:define name="electronicaddress-form" />
            </ui:decorate>

            <div class="col-12 md:col-6">
                <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                    <ui:define name="fields">

                        <div class="field ui-fluid">
                            <p:outputLabel for="kategoriKitab" value="Kategori Kitab" />
                            <p:selectOneMenu id="kategoriKitab" value="#{viewPage.entity.kategoriKitab}" 
                                             converter="KategoriKitabConverter" immediate="true"
                                             autoWidth="false" required="true" dynamic="true" >                        
                                <f:selectItem itemLabel="Pilih" itemValue="#{null}" />
                                <f:selectItems value="#{kategoriKitabList.fetchedItems}" 
                                               var="item" itemValue="#{item}"  
                                               itemLabel="#{item.name}" />
                                <p:ajax update="jenisKitab" /> 
                            </p:selectOneMenu>
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="jenisKitab" value="Jenis Kitab" />
                            <p:selectOneMenu id="jenisKitab" value="#{viewPage.entity.jenisKitab}"                                             
                                             converter="JenisKitabConverter" var="i"
                                             autoWidth="false" required="true" >                        
                                <f:selectItem itemLabel="Pilih" itemValue="#{null}" />
                                <f:selectItems value="#{viewPage.jenisKitabList.fetchedItems}" 
                                               var="item" itemValue="#{item}"
                                               itemLabel="#{item.label}" />
                                <p:column>
                                    <h:outputText class="block text-xl font-bold white-space-normal amiri-bold text-lg" 
                                                  style="direction: rtl"  
                                                  value="#{i.judul}" />
                                </p:column>
                                <p:column>
                                    <h:outputText class="block text-xl font-bold white-space-normal amiri-bold text-lg" 
                                                  style="direction: rtl"  
                                                  value="#{i.subJudul}" />
                                </p:column>
                            </p:selectOneMenu>
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="jenis" value="Jenis" />
                            <p:selectOneMenu id="jenis" value="#{viewPage.entity.gender}"
                                             converter="GenderTypeConverter" dynamic="true" >
                                <f:selectItems value="#{genderTypeList.fetchedItems}" var="item"
                                               itemLabel="#{item.label}" itemValue="#{item}" />
                            </p:selectOneMenu>  
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="kelompok" value="Kelompok" />
                            <p:selectOneMenu id="kelompok" value="#{viewPage.entity.kelompok}" 
                                             converter="KelompokHalaqohPengajaranConverter"
                                             autoWidth="false" required="true" dynamic="true" >                        
                                <f:selectItem itemLabel="Pilih" itemValue="#{null}" />
                                <f:selectItems value="#{kelompokHalaqohPengajaranList.fetchedItems}" 
                                               var="item" itemValue="#{item}"  
                                               itemLabel="#{item.name}" />
                            </p:selectOneMenu>
                        </div>

                    </ui:define>
                </ui:decorate>
            </div>

        </div>

    </ui:define>


</ui:composition>
