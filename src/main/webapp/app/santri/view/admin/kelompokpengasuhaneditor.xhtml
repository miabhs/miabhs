<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/editor-page.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

    <f:metadata>
        <ui:param name="primaryTitle" value="Editor Kelompok Pengasuhan" />
        <ui:param name="secondaryTitle" value="Baru" /> 

        <ui:param name="viewPage" value="#{kelompokPengasuhanEditorPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>         

        <f:viewParam name="entity" value="#{viewPage.entity}" converter="KelompokPengasuhanConverter" transient="true" />

        <f:viewAction action="#{viewPage.load}" />
    </f:metadata>

    <ui:define name="content-header" />

    <ui:define name="form">

        <div class="grid w-full p-3">

            <ui:decorate template="/WEB-INF/components/core/party/organizationeditorform.xhtml" >
                <ui:param name="editor" value="#{viewPage.form}" />

                <ui:define name="organizationform-suffix">
                    <div class="field ui-fluid">
                        <p:outputLabel for="gender" value="#{string['person.gender.label']}" />
                        <p:selectOneMenu id="gender" value="#{form.entity.gender}"
                                         converter="GenderTypeConverter" >
                            <f:selectItems value="#{genderTypeList.fetchedItems}" var="item"
                                           itemLabel="#{item.label}" itemValue="#{item}" />
                        </p:selectOneMenu>  
                    </div>
                </ui:define>

                <ui:define name="postaladdress-form" />
                <ui:define name="telecommunicationnumber-form" />
                <ui:define name="electronicaddress-form" />

            </ui:decorate>

        </div>

    </ui:define>


</ui:composition>
