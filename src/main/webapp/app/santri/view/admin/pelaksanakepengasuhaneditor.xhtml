<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/editor-page.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

    <f:metadata>
        <ui:param name="primaryTitle" value="Editor Pembantu Pelaksana Kepengasuhan" /> 
        <ui:param name="secondaryTitle" value="Baru" />
        
        <ui:param name="viewPage" value="#{pelaksanaKepengasuhanEditorPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <f:viewParam name="entity" value="#{viewPage.entity}" converter="PelaksanaKepengasuhanConverter" transient="true" />

        <f:viewParam name="fromRole" value="#{viewPage.fromRole}" converter="UstadzConverter" transient="true" />
        <f:viewParam name="toRole" value="#{viewPage.toRole}" converter="KelompokPengasuhanConverter" transient="true" />

        <f:viewAction action="#{viewPage.load}" />
    </f:metadata>

    <ui:define name="content-header" />

    <ui:define name="form">

        <div class="grid w-full p-3">

            <div class="col-12 md:col-6">
                <ui:decorate template="/WEB-INF/components/core/base/form.xhtml">
                    <ui:define name="fields">

                        <div class="field ui-fluid">
                            <p:outputLabel for="torole" value="Kelompok Kepengasuhan" />
                            <p:outputPanel class="ui-inputgroup">
                                <p:inputText id="torole" value="#{viewPage.entity.toRole ne null ? viewPage.entity.toRole.party.name : ''}" readonly="true" />
                            </p:outputPanel>
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="fungsional" value="Fungsional" />
                            <p:selectOneMenu id="fungsional" value="#{viewPage.entity.fungsional}"
                                             converter="FungsionalKepengasuhanConverter" >                        
                                <f:selectItem itemLabel="Semua" itemValue="#{null}" />
                                <f:selectItems value="#{fungsionalKepengasuhanList.fetchedItems}" var="item"
                                               itemLabel="#{item.label}" itemValue="#{item}" />
                                <p:ajax process="@this" />
                            </p:selectOneMenu>
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="atribut" value="Atribut" />
                            <p:selectOneMenu id="atribut" value="#{viewPage.entity.salute}"
                                             converter="PersonalSalutationConverter"  >                        
                                <f:selectItem itemLabel="Semua" itemValue="#{null}" />
                                <f:selectItems value="#{personalSalutationList.fetchedItems}" var="item"
                                               itemLabel="#{item.label}" itemValue="#{item}" />
                                <p:ajax process="@this" />
                            </p:selectOneMenu>
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="person" value="Person" />
                            <p:outputPanel class="ui-inputgroup">
                                <p:inputText id="person" value="#{viewPage.entity.fromRole ne null ? viewPage.entity.fromRole.party.name : ''}" readonly="true" />
                                <p:commandButton icon="pi pi-search" immediate="true" 
                                                 action="#{viewPage.openFromRoleChooser}" >
                                </p:commandButton>
                            </p:outputPanel>
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="from" value="Sejak" />
                            <p:datePicker id="from" value="#{viewPage.entity.fromDate}"
                                          pattern="dd/MM/yyyy" showTime="false" monthNavigator="true" yearNavigator="true"
                                          required="true" />
                        </div>

                        <div class="field ui-fluid">
                            <p:outputLabel for="thru" value="Sampai" />
                            <p:datePicker id="thru" value="#{viewPage.entity.thruDate}"
                                          pattern="dd/MM/yyyy" showTime="false" monthNavigator="true" yearNavigator="true" />
                        </div>

                    </ui:define>
                </ui:decorate>
            </div>

        </div>

    </ui:define>

</ui:composition>
