<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/page.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <ui:param name="title" value="#{string['santri.musyrif.label']}" />

        <ui:param name="viewPage" value="#{musyrifPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>
        
        <ui:param name="dataView" value="#{viewPage.dataView}" />
        <ui:param name="contentId" value=":data-frm:#{dataView.name}" /> 
        <ui:param name="notool" value="true" />
        
        <ui:param name="filter" value="#{dataView.filter}" />
        <ui:param name="filterType" value="overlay" />
        <ui:param name="filterUi" value="/WEB-INF/components/core/common/common-filterui.xhtml" />
        <ui:include src="/WEB-INF/components/core/common/meta/common-filterui.xhtml" />

        <ui:param name="pager" value="#{dataView.pager}" />
        <ui:include src="/WEB-INF/components/core/base/meta/pager.xhtml" />
        
        <f:viewParam name="s" value="#{dataView.selectionsInternal}" converter="MusyrifListConverter" transient="true" />
    </f:metadata>

    <ui:define name="module-menu">
        <ui:include src="/WEB-INF/components/app/santri/module-menu.xhtml" />
    </ui:define>

    <ui:define name="content">
        <h:form id="data-frm" class="flex-grow-1 flex align-items-stretch">
            <ui:include src="/WEB-INF/components/app/santri/musyriflist.xhtml" />
        </h:form>
    </ui:define>

</ui:composition>
