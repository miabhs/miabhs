<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/explorer.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <ui:param name="title" value="Tahun Pembelajaran" />

        <ui:param name="viewPage" value="#{tahunPembelajaranPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/page.xhtml"/>

        <ui:param name="masterTitle" value="Tahun" />           
        <ui:param name="master_notool" value="true" />       
        <ui:param name="masterDataView" value="#{viewPage.tahunPembelajaranList}" />        
        <ui:param name="masterContentId" value=":master-frm:#{masterDataView.name}" />         
        <f:viewParam name="ms" value="#{masterDataView.selectionInternal}" converter="TahunPembelajaranConverter" transient="true" />
        
        <ui:param name="masterFilter" value="#{masterDataView.filter}" />
        <ui:param name="masterFilterType" value="overlay" />
        <ui:param name="masterFilterUi" value="/WEB-INF/components/core/common/common-filterui.xhtml" /> 
        <ui:include src="/WEB-INF/components/core/common/meta/common-filterui.xhtml" >
            <ui:param name="filter" value="#{masterFilter}" />
        </ui:include>
        
        <ui:param name="masterPager" value="#{masterDataView.pager}" />
        <f:viewParam name="mp" value="#{masterPager.pageSize}" converter="LongConverter" transient="true" />
        <f:viewParam name="mo" value="#{masterPager.offset}" converter="LongConverter" transient="true" /> 

        <ui:param name="detailTitle" value="Periode" />
        <ui:param name="detail_notool" value="true" />
        <ui:param name="detailDataView" value="#{viewPage.periodePembelajaranTree}" />
        <ui:param name="detailContentId" value=":detail-frm:#{detailDataView.name}" />
        <f:viewParam name="ds" value="#{detailDataView.selectionsInternal}" converter="PeriodePembelajaranListConverter" transient="true" />
        
        <ui:param name="detailFilter" value="#{detailDataView.filter}" />
        <ui:param name="detailFilterType" value="overlay" />
        <ui:param name="detailFilterUi" value="/WEB-INF/components/app/santri/periodepembelajaran-filterui.xhtml" /> 
        <ui:include src="/WEB-INF/components/app/santri/meta/periodepembelajaran-filterui.xhtml" >
            <ui:param name="filter" value="#{detailFilter}" />
        </ui:include>       
    </f:metadata>

    <ui:define name="styles">
        <style>
            .ui-datatable-scrollable-header, .ui-treetable-scrollable-header {
                display: none;
            }
            .ui-datatable-scrollable-body {
                display: flex!important;
                flex-direction: column!important;
            }
            .ui-datatable-scrollable-header-box table, .ui-datatable-scrollable-body table {
                width: auto!important
            }
            .ui-treetable-scrollable-body {
                padding-right: 0!important;
            }
            tr.ui-treetable-selectable-node td {
                padding: .55rem 1rem!important;
            }
        </style>
    </ui:define> 

    <ui:define name="module-menu">
        <ui:include src="/WEB-INF/components/app/santri/module-menu.xhtml" />
    </ui:define>

    <ui:define name="master">
        <h:form id="master-frm" class="block flex-grow-1 align-self-stretch">
            <ui:include src="/WEB-INF/components/app/santri/tahunpembelajaranlist.xhtml" >
                <ui:param name="dataView" value="#{masterDataView}" />
                <ui:param name="selectCallback" value="refreshMasterCasing();refreshDetailCasing();refreshDetail()" />
                <ui:param name="updateCallback" value="refreshMaster();refreshDetail()" />
            </ui:include>
        </h:form>
    </ui:define>

    <ui:define name="detail">
        <h:form id="detail-frm" class="block flex-grow-1 align-self-stretch">
            <ui:include src="/WEB-INF/components/app/santri/periodepembelajarantree.xhtml" >
                <ui:param name="dataView" value="#{detailDataView}" />
                <ui:param name="selectCallback" value="refreshDetailCasing()" />
                <ui:param name="updateCallback" value="refreshDetail()" />
            </ui:include>
        </h:form>
    </ui:define>

</ui:composition>
