<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/chooser-page.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui">
    
    <f:metadata>
        <ui:param name="primaryTitle" value="Pilih Ustadz" />
        
        <ui:param name="viewPage" value="#{ustadzSingleChooserPage}" />
        <ui:include src="/WEB-INF/components/core/base/meta/chooser-page.xhtml" />
        
        <ui:param name="dataView" value="#{viewPage.dataView}" /> 
        <ui:param name="contentId" value=":data-frm:#{dataView.name}" />
               
        <ui:param name="filter" value="#{dataView.filter}" />
        <ui:param name="filterType" value="overlay" />
        <ui:param name="filterUi" value="/WEB-INF/components/core/common/common-filterui.xhtml" />
        <ui:include src="/WEB-INF/components/core/common/meta/common-filterui.xhtml" />
        
        <ui:param name="pager" value="#{dataView.pager}" /> 
        <ui:include src="/WEB-INF/components/core/base/meta/pager.xhtml" />
        
        <f:viewParam name="s" value="#{dataView.selectionInternal}" converter="UstadzConverter" transient="true" />
        
    </f:metadata>

    <ui:define name="content">        
        <h:form id="data-frm">            
            <ui:include src="/WEB-INF/components/app/santri/ustadzlist.xhtml" />
        </h:form>
    </ui:define>

</ui:composition>
